services:
  web:
    build: .
    command: sh -c "python wait_for_db.py && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creditdb}
      POSTGRES_USER: ${POSTGRES_USER:-credituser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
