{% extends "base.html" %}
{% block content %}

<div class="card">
<h2>Register Customer</h2>

<input id="first" placeholder="First Name">
<input id="last" placeholder="Last Name">
<input id="age" placeholder="Age">
<input id="salary" placeholder="Monthly Salary">
<input id="phone" placeholder="Phone Number">

<button onclick="register()">Register</button>

<div class="result" id="result"></div>
</div>

<script>
function register(){
fetch("/api/customers/register/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
first_name:first.value,
last_name:last.value,
age:age.value,
monthly_salary:salary.value,
phone_number:phone.value
})
})
.then(res=>res.json())
.then(data=>{
result.innerHTML="Customer ID : "+data.customer_id;
})
}
</script>

{% endblock %}
