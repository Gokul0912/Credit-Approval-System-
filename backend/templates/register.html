{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html>
<head>
    <title>Register Customer</title>
</head>

<body>

<h2>Register Customer</h2>

<form id="registerForm">
    {% csrf_token %}

    <input type="text" id="first_name" placeholder="First Name"><br><br>
    <input type="text" id="last_name" placeholder="Last Name"><br><br>
    <input type="number" id="age" placeholder="Age"><br><br>
    <input type="number" id="monthly_salary" placeholder="Monthly Salary"><br><br>
    <input type="text" id="phone_number" placeholder="Phone Number"><br><br>

    <button type="submit">Register</button>
</form>

<p id="result"></p>

<script>

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrftoken = getCookie('csrftoken');

document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const response = await fetch("/api/customers/register/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
        },
        body: JSON.stringify({
            first_name: document.getElementById("first_name").value,
            last_name: document.getElementById("last_name").value,
            age: document.getElementById("age").value,
            monthly_salary: document.getElementById("monthly_salary").value,
            phone_number: document.getElementById("phone_number").value
        })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
<div class="card">
  <div class="card-row"><b>Customer ID:</b> ${data.customer_id}</div>
  <div class="card-row"><b>Name:</b> ${data.first_name} ${data.last_name}</div>
  <div class="card-row"><b>Phone:</b> ${data.phone_number}</div>
  <div class="card-row"><b>Age:</b> ${data.age}</div>
</div>
`;

});

</script>

</body>
</html>
{% endblock %}
